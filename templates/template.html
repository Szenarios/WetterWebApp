<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JZ Wetter Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
                        body: ['"Inter"', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#22d3ee',
                            muted: '#0891b2'
                        }
                    },
                    backgroundImage: {
                        "aurora": 'radial-gradient(circle at 10% 20%, rgba(34,211,238,0.25), transparent 55%), radial-gradient(circle at 80% 10%, rgba(59,130,246,0.25), transparent 45%), radial-gradient(circle at 50% 80%, rgba(236,72,153,0.18), transparent 50%)'
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-body">
<div class="relative flex min-h-screen flex-col bg-aurora">
    <!-- <header class="border-b border-white/5 bg-slate-950/70 backdrop-blur">
         <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-6 py-5 lg:px-10">
             <div>
                 <p class="text-xs uppercase tracking-[0.35em] text-brand-muted">Jahnschule Zwickau</p>
                 <h1 class="font-display text-2xl font-semibold text-white sm:text-3xl">Interaktives Wetter-Dashboard</h1>
                 <p class="mt-1 text-sm text-slate-400">Erkunde Wetterdaten für Standorte in Deutschland – einfach auswählen, analysieren und teilen.</p>
             </div>
             <span class="hidden rounded-full border border-brand/40 bg-brand/10 px-3 py-1 text-xs font-medium text-brand lg:inline-flex">Live Beta</span>
         </div>
     </header>-->

    <main class="flex flex-1 flex-col-reverse lg:flex-row">
        <section
                class="w-full border-t border-white/5 bg-slate-950/80 shadow-2xl shadow-slate-900/60 backdrop-blur lg:w-[420px] lg:border-r lg:border-t-0">
            <div class="mx-auto flex h-full w-full max-w-xl flex-col gap-6 overflow-y-auto px-6 py-8 lg:px-8">

                <div class="rounded-3xl border border-white/5 bg-slate-900/70 p-6 shadow-lg shadow-sky-900/25">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs uppercase tracking-[0.3em] text-brand-muted">Standort</p>
                            <h2 class="font-display text-xl font-semibold text-white">Ausgewählte Koordinaten</h2>
                        </div>
                        <span class="rounded-full bg-brand/15 px-3 py-1 text-xs font-medium text-brand">Karte</span>
                    </div>
                    <p id="coordsInfo" class="mt-5 text-sm leading-relaxed text-slate-300">Noch kein Standort
                        ausgewählt.</p>
                    <!--<p class="mt-3 text-xs text-slate-500">Klicke in die Karte oder bewege Marker per Drag &amp; Drop, um Orte zu analysieren.</p>
                    -->
                </div>

                <div id="weather-info"
                     class="rounded-3xl border border-white/5 bg-slate-900/70 p-6 shadow-lg shadow-slate-900/40">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs uppercase tracking-[0.3em] text-brand-muted">Wetter</p>
                            <!--<h2 class="font-display text-xl font-semibold text-white">Echtzeit Analyse</h2>-->

                        </div>
                        <svg class="h-8 w-8 text-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 2v2"/>
                            <path d="M5.22 5.22l1.42 1.42"/>
                            <path d="M2 12h2"/>
                            <path d="M5.22 18.78l1.42-1.42"/>
                            <path d="M12 20v2"/>
                            <path d="M18.78 18.78L17.36 17.36"/>
                            <path d="M20 12h2"/>
                            <path d="M18.78 5.22l-1.42 1.42"/>
                            <path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/>
                        </svg>
                    </div>
                    <div id="weatherDetails" class="mt-5 space-y-4 text-sm text-slate-200">
                        <p class="text-slate-300">Bitte setze einen Pin auf der Karte.</p>
                    </div>
                    <div class="mt-6 flex flex-wrap gap-3">
                        <button id="dashboard_btn"
                            class="flex-1 rounded-2xl border border-brand/40 bg-brand/20 px-4 py-3 text-sm font-semibold text-brand transition hover:border-brand hover:bg-brand/25 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">
                            Weitere Informationen
                        </button>

                    </div>
                </div>

                <div class="rounded-3xl border border-white/5 bg-slate-900/70 p-6 shadow-lg shadow-slate-900/40">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs uppercase tracking-[0.3em] text-brand-muted">Zeitraum &amp; Radius</p>
                            <h2 class="font-display text-xl font-semibold text-white">Filter anpassen</h2>
                        </div>
                    </div>
                    <div class="mt-5 grid gap-4">
                        <label class="flex flex-col gap-2">
                            <span class="text-xs font-medium uppercase tracking-[0.2em] text-slate-400">Startdatum</span>
                            <input id="startDate" type="date"
                                   class="rounded-2xl border border-white/5 bg-slate-950/60 px-3 py-2 text-sm text-white shadow-inner shadow-black/40 focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/50">
                        </label>
                        <label class="flex flex-col gap-2">
                            <span class="text-xs font-medium uppercase tracking-[0.2em] text-slate-400">Enddatum</span>
                            <input id="endDate" type="date"
                                   class="rounded-2xl border border-white/5 bg-slate-950/60 px-3 py-2 text-sm text-white shadow-inner shadow-black/40 focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/50">
                        </label>
                    </div>
                    <div class="mt-6 space-y-3">
                        <div class="flex items-center justify-between text-xs uppercase tracking-[0.15em] text-slate-400">
                            <span>Radius</span>
                            <span id="radiusValue" class="font-semibold text-brand">15 km</span>
                        </div>
                        <input id="radiusSlider" type="range" min="1" max="100" value="15" class="range-input">
                    </div>
                    <div class="mt-6 flex flex-wrap gap-3">
                        <button id="reloadBtn"
                                class="flex-1 rounded-2xl border border-brand/40 bg-brand/20 px-4 py-3 text-sm font-semibold text-brand transition hover:border-brand hover:bg-brand/25 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">
                            Daten neu laden
                        </button>
                    </div>
                </div>
                <!-- Upload auskommentiert
                <div class="rounded-3xl border border-white/5 bg-slate-900/70 p-6 shadow-lg shadow-slate-900/40">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs uppercase tracking-[0.3em] text-brand-muted">Daten</p>
                            <h2 class="font-display text-xl font-semibold text-white">Upload &amp; Analyse</h2>
                        </div>
                    </div>
                    <form id="uploadForm" class="mt-5 space-y-4" enctype="multipart/form-data">
                        <label class="flex flex-col gap-2">
                            <span class="text-xs font-medium uppercase tracking-[0.2em] text-slate-400">Datei auswählen</span>
                            <input type="file" name="file" class="rounded-2xl border border-white/5 bg-slate-950/60 px-3 py-2 text-sm text-slate-100 file:mr-4 file:rounded-xl file:border-0 file:bg-brand/20 file:px-4 file:py-2 file:text-brand file:text-sm hover:file:bg-brand/30">
                        </label>
                        <button type="submit" class="w-full rounded-2xl bg-brand px-4 py-3 text-sm font-semibold text-slate-950 shadow-lg shadow-cyan-500/30 transition hover:bg-sky-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand">Upload starten</button>
                        <p class="text-xs text-slate-400">Unterstützt CSV und XLSX Rohdaten. Die Analyse wird unmittelbar aktiviert.</p>
                    </form>
                </div> -->
            </div>
        </section>

        <section class="relative flex-1">
            <div class="absolute inset-0">
                <div id="map"
                     class="h-full w-full rounded-b-[2.5rem] rounded-tl-[2.5rem] border border-white/5 bg-slate-950"></div>
            </div>
            <div class="pointer-events-none absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-slate-950 to-transparent"></div>
        </section>
    </main>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='skript.js') }}"></script>
</body>
</html>
